<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="tankstorm-keepalive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="55%" stop-color="#111A31"/>
      <stop offset="100%" stop-color="#1A1230"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="glowline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#5B7BB4" fill-opacity=".16"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <ellipse cx="200" cy="60" rx="380" ry="240" fill="url(#halo)"/>
    <ellipse cx="1120" cy="300" rx="420" ry="260" fill="url(#halo2)"/>

    <!-- 左侧：标题区 -->
    <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',-apple-system,Segoe UI,sans-serif">
      <text x="72" y="96" font-size="17" letter-spacing="3.5" fill="#7DD3FC" font-weight="600">QQ 空间 · FLASH 页游</text>

      <text x="70" y="164" font-size="58" font-weight="800" fill="url(#title)"
            font-family="'SF Mono',ui-monospace,'JetBrains Mono',Consolas,monospace"
            letter-spacing="-1">tankstorm-keepalive</text>

      <text x="72" y="206" font-size="21" fill="#CBD5E1">「坦克风暴」保活守护 · 每日任务自动化</text>

      <text x="72" y="240" font-size="15.5" fill="#8FA3C0">
        不开浏览器 · 不跑 Flash · 不识图 —— 纯 Python 复刻整条 TCP 链路
      </text>

      <!-- 技术标签 -->
      <g font-size="13.5" font-weight="600" font-family="ui-monospace,Consolas,monospace">
        <g transform="translate(72,266)">
          <rect width="96" height="30" rx="15" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".55"/>
          <text x="48" y="20" text-anchor="middle" fill="#7DD3FC">裸 TCP</text>
        </g>
        <g transform="translate(180,266)">
          <rect width="104" height="30" rx="15" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/>
          <text x="52" y="20" text-anchor="middle" fill="#C4B5FD">protobuf</text>
        </g>
        <g transform="translate(296,266)">
          <rect width="74" height="30" rx="15" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".55"/>
          <text x="37" y="20" text-anchor="middle" fill="#6EE7B7">RC4</text>
        </g>
        <g transform="translate(382,266)">
          <rect width="128" height="30" rx="15" fill="#FBBF24" fill-opacity=".14" stroke="#FBBF24" stroke-opacity=".55"/>
          <text x="64" y="20" text-anchor="middle" fill="#FCD34D">SWF 逆向</text>
        </g>
      </g>
    </g>

    <!-- 右侧：帧结构可视化 -->
    <g transform="translate(720,74)" font-family="ui-monospace,Consolas,'SF Mono',monospace">
      <text x="0" y="0" font-size="13" letter-spacing="2.2" fill="#64748B"
            font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个包长这样</text>

      <!-- 四段 -->
      <g transform="translate(0,18)">
        <rect x="0"   y="0" width="96"  height="62" rx="9" fill="#38BDF8" fill-opacity=".16" stroke="#38BDF8" stroke-opacity=".7"/>
        <rect x="104" y="0" width="96"  height="62" rx="9" fill="#A78BFA" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".7"/>
        <rect x="208" y="0" width="112" height="62" rx="9" fill="#34D399" fill-opacity=".16" stroke="#34D399" stroke-opacity=".7"/>
        <rect x="328" y="0" width="152" height="62" rx="9" fill="#FBBF24" fill-opacity=".13" stroke="#FBBF24" stroke-opacity=".65" stroke-dasharray="5 3"/>

        <g font-size="15" font-weight="700" text-anchor="middle">
          <text x="48"  y="27" fill="#7DD3FC">长度</text>
          <text x="152" y="27" fill="#C4B5FD">opcode</text>
          <text x="264" y="27" fill="#6EE7B7">seq</text>
          <text x="404" y="27" fill="#FCD34D">body</text>
        </g>
        <g font-size="11.5" text-anchor="middle" fill="#7C8DA8">
          <text x="48"  y="46">2B 大端</text>
          <text x="152" y="46">2B</text>
          <text x="264" y="46">4B 恒 0</text>
          <text x="404" y="46">protobuf + RC4</text>
        </g>
      </g>

      <!-- 心跳字节 -->
      <g transform="translate(0,102)">
        <text x="0" y="0" font-size="12" fill="#5A6B85">心跳帧 · 每 10 秒</text>
        <g font-size="17" font-weight="700" letter-spacing="1">
          <text x="0"   y="26" fill="#7DD3FC">00 06</text>
          <text x="104" y="26" fill="#C4B5FD">04 0e</text>
          <text x="208" y="26" fill="#6EE7B7">00 00 00 00</text>
        </g>
      </g>

      <!-- 规模数字 -->
      <g transform="translate(0,158)" font-size="12.5" fill="#7C8DA8"
         font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        <text x="0" y="0">从 12MB 混淆 SWF 还原：</text>
        <text x="0" y="24" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#94A3B8">
          563 <tspan font-size="12" font-weight="400" fill="#64748B">opcode</tspan>
          <tspan dx="14" fill="#94A3B8">873</tspan> <tspan font-size="12" font-weight="400" fill="#64748B">消息</tspan>
          <tspan dx="14" fill="#94A3B8">5582</tspan> <tspan font-size="12" font-weight="400" fill="#64748B">字段</tspan>
        </text>
      </g>
    </g>

    <rect x="0" y="336" width="1280" height="4" fill="url(#glowline)"/>
  </g>
</svg>
